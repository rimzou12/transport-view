name: backend-ci

# Deliberately no `paths:` filter: this check is required by branch protection (see
# RELEASING.md). A path-filtered required check that never runs for a given PR leaves GitHub
# waiting on it forever, permanently blocking merge — so it must run on every PR regardless of
# which files changed.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests (unit + integration via Testcontainers)
        run: ./mvnw -B verify
