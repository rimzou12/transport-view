# Render Blueprint — see DEPLOYMENT.md for the one-time setup steps, including the DB_* secrets
# below (sync: false — Render prompts for these in its dashboard during/after Apply, nothing
# sensitive is stored in this file) and the manual URL-verification step this file can't fully
# automate (Render's blueprint spec has no way to reference another service's *public* URL from
# within a service's own env vars — only its private network address, unreachable from the
# browser).
#
# No `databases:` block here on purpose: this uses an external Postgres (Neon) rather than a
# Render-managed one — see DEPLOYMENT.md for why.

services:
  - name: transport-view-backend
    type: web
    runtime: docker
    rootDir: backend
    # Relative to rootDir (backend/), not the repo root — despite what Render's own Blueprint
    # docs say ("dockerfilePath/dockerContext are always repo-root-relative"), in practice
    # rootDir does affect these too. Using repo-root-style paths here doubles up to
    # backend/backend/Dockerfile, which doesn't exist, and the deploy fails on checkout.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # "free" spins down after 15 min of inactivity (next request pays a ~30-60s cold-start cost
    # waking it back up) and caps at 750 instance-hours/month across the whole workspace — fine
    # for a demo, not for something you want always-responsive. See DEPLOYMENT.md.
    plan: free
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      # Secrets — not stored here. Render will prompt for these during Apply, or fill them in
      # afterward via dashboard → this service → Environment. Source them from your Postgres
      # provider's own connection details (e.g. Neon project → Connection string) — never paste
      # them into this file or into chat/commits.
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "5432"
      # Neon (and most hosted Postgres) requires SSL; our local/CI Postgres doesn't have it
      # configured, so this isn't the backend's default — set explicitly here instead.
      - key: DB_SSL_MODE
        value: require
      - key: ADMIN_GTFS_IMPORT_API_KEY
        generateValue: true
      # Placeholder — replace with the frontend's actual onrender.com URL once known
      # (see DEPLOYMENT.md step 4).
      - key: CORS_ALLOWED_ORIGINS
        value: https://transport-view-frontend.onrender.com

  - name: transport-view-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:render
    staticPublishPath: ./dist/frontend/browser
    branch: main
    envVars:
      # Placeholder — replace with the backend's actual onrender.com URL once known
      # (see DEPLOYMENT.md step 4).
      - key: API_BASE_URL
        value: https://transport-view-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
