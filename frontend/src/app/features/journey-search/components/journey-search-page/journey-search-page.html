<div class="journey-search">
  <form class="journey-search__form" (submit)="onSubmit($event)">
    <mat-form-field appearance="outline">
      <mat-label>From</mat-label>
      <input matInput [formControl]="originControl" [matAutocomplete]="originAuto" placeholder="Search a stop" />
      <mat-autocomplete #originAuto="matAutocomplete" (optionSelected)="selectOrigin($event)">
        @for (stop of originSuggestions(); track stop.id) {
          <mat-option [value]="stop.name">{{ stop.name }}</mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>To</mat-label>
      <input matInput [formControl]="destinationControl" [matAutocomplete]="destinationAuto" placeholder="Search a stop" />
      <mat-autocomplete #destinationAuto="matAutocomplete" (optionSelected)="selectDestination($event)">
        @for (stop of destinationSuggestions(); track stop.id) {
          <mat-option [value]="stop.name">{{ stop.name }}</mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Departure time</mat-label>
      <input matInput type="time" [formControl]="departureTimeControl" />
    </mat-form-field>

    <button
      mat-flat-button
      type="submit"
      [disabled]="!selectedOrigin() || !selectedDestination() || loading()"
    >
      <mat-icon>search</mat-icon>
      Search
    </button>
  </form>

  <div class="journey-search__results">
    <app-itinerary-list
      [itineraries]="itineraries()"
      [loading]="loading()"
      [error]="error()"
      [searched]="searched()"
    />
  </div>

  <div class="journey-search__map">
    <app-journey-map
      [origin]="selectedOrigin()"
      [destination]="selectedDestination()"
      [selectedItinerary]="selectedItinerary()"
    />
  </div>
</div>
